<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>HiTalent · Worketers</title>
<style>
:root{--ink:#152f35;--muted:#5c7478;--teal:#007f83;--line:#d8e5e4;--paper:#fff;--bg:#f3f7f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button,.button{border:0;border-radius:9px;padding:11px 18px;background:var(--teal);color:white;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e5efed;color:var(--ink)}.ghost{background:transparent;color:var(--teal)}header{border-bottom:1px solid var(--line);background:white;padding:16px 5%;display:flex;align-items:center;gap:24px;justify-content:space-between}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--teal)}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{font-size:13px}main{max-width:1200px;margin:35px auto;padding:0 24px}h1{font-size:clamp(28px,4vw,46px);line-height:1.15;letter-spacing:-1px;margin:12px 0 18px}h2{font-size:24px;margin:0 0 16px}h3{margin:0 0 8px}p{color:var(--muted)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center;padding:42px 0}.hero p{max-width:560px;font-size:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.jobs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.job{padding:22px;border:1px solid var(--line);border-radius:12px;background:white}.job p{white-space:pre-wrap}.badge{display:inline-block;border-radius:20px;padding:3px 10px;background:#e0f3ee;color:#146052;font-size:12px;font-weight:600}.label,label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #b9cfcc;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:110px;resize:vertical}input[type=checkbox]{width:auto}.full{grid-column:1/-1}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}.notice{padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:#e5f4ef;white-space:pre-wrap;margin:16px 0}.error{background:#fff0ed;color:#8c2d20;border-color:#e6b7ae}[hidden]{display:none!important}.narrow{max-width:740px;margin:auto}.login{max-width:440px;margin:55px auto}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar input{max-width:350px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}td button{padding:7px 12px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:12px;background:white;padding:20px}.stat strong{font-size:30px;display:block}.stat span{color:var(--muted);font-size:13px}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;width:min(850px,94vw);max-height:90vh;color:var(--ink)}dialog::backdrop{background:#152f3577}dl{display:grid;grid-template-columns:1fr 2fr;gap:0;margin:16px 0}dt,dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0;white-space:pre-wrap;overflow-wrap:anywhere}dt{font-size:12px;color:var(--muted)}dd{padding-left:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:12px;font-size:12px}footer{max-width:1200px;margin:50px auto 20px;padding:20px 24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.trap{position:absolute;left:-10000px}.step{border-left:3px solid var(--teal);padding:0 0 0 18px;margin:22px 0}.step b{display:block}.step span{color:var(--muted);font-size:13px}@media(max-width:760px){header{align-items:flex-start;flex-direction:column;gap:12px}.hero,.grid,.jobs{grid-template-columns:1fr}.hero{padding:15px 0;gap:15px}main{padding:0 16px;margin-top:24px}.card{padding:20px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:25px}h1{font-size:34px}dl{grid-template-columns:1fr}dd{padding-left:0}}
</style></head><body>
<header><div class="brand">HiTalent<small>POR WORKETERS</small></div><nav aria-label="Navegación principal"><button class="ghost" data-route="inicio">Inicio</button><button class="ghost" data-route="candidatos">Soy candidato</button><button class="secondary" data-route="admin">Acceso del equipo</button></nav></header>
<main><div id="message" role="status" aria-live="polite" hidden></div><div id="screen"></div></main>
<dialog id="modal"><div class="toolbar"><h2 id="modalTitle"></h2><button class="secondary" id="closeModal" aria-label="Cerrar detalle">Cerrar</button></div><div id="modalBody"></div><div id="modalMessage" role="status" hidden></div></dialog>
<footer>HiTalent · Worketers <span style="float:right">Personas, oportunidades y equipo.</span></footer>
<script>
'use strict';
const initialView = '<?= initialView ?>';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('hitalent_session')||'',profile=null,panel=null,view=initialView,tab='candidatos',users=[],logs=[],jobs=[],filter='',submissionId=crypto.randomUUID();
const candStates=['Pendiente','En revisión','Entrevista','En proceso','Contratado','Descartado'];
const reqStates=['Activa','Pausada','Cerrada'];
const labels={nombreSolicitante:'Nombre del solicitante',empresaCliente:'Empresa',telefonoContacto:'Teléfono fijo',celularContacto:'Celular',emailContacto:'Correo de contacto',nombrePosicion:'Nombre de la posición',numeroVacantes:'Número de vacantes',tipoVacante:'Tipo de vacante',ubicacion:'Ubicación',horarioLaboral:'Horario',reportaA:'Reporta a',edadMinMax:'Edad sugerida',estadoCivil:'Estado civil',genero:'Género',escolaridad:'Escolaridad',objetivoPuesto:'Objetivo del puesto',experienciaRequerida:'Experiencia requerida',requisitosIndispensables:'Requisitos indispensables',requisitosDeseables:'Requisitos deseables',conocimientosCualidades:'Conocimientos y cualidades',habilidadesTecnologicas:'Habilidades tecnológicas',idiomas:'Idiomas',competenciasEvaluar:'Competencias a evaluar',actividadesDesempenar:'Actividades a desempeñar',sueldoBruto:'Sueldo mensual bruto',sueldoNeto:'Sueldo mensual neto',prestacionesLey:'Prestaciones de ley',prestacionesSuperiores:'Prestaciones superiores',compensacionesVariables:'Compensaciones variables',esquemaPago:'Esquema de pago',frecuenciaPago:'Frecuencia de pago',tipoContrato:'Tipo de contrato',periodoPrueba:'Periodo de prueba',requisitosAutoTransporte:'Requisitos de transporte',observacionesExtras:'Observaciones'};
function notice(text,error=false,target='message'){const el=$(target);el.textContent=text;el.className='notice'+(error?' error':'');el.hidden=!text;}
const API_URL='https://script.google.com/macros/s/AKfycbwxMBgBHl1hzU6tCfKWdOVpvUYFdgeqo6Sm1vyvuqQIQPsPiCxRO5EpH_2NaZDyJLVg/exec';
async function rpc(action,data={}){
  let response;
  if(window.google?.script?.run){response=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(()=>reject(new Error('No se pudo conectar. Intenta de nuevo.'))).api(action,data,token));}
  else{
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);
    try{const result=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},credentials:'omit',redirect:'follow',body:JSON.stringify({action,data,token}),signal:controller.signal});if(!result.ok)throw new Error();response=await result.json();}
    catch(e){throw new Error('No se pudo conectar. Intenta de nuevo; tus datos se conservan.');}finally{clearTimeout(timer);}
  }
  if(!response?.success)throw new Error(response?.error||'No se pudo completar la operación.');return response.data;
}
async function busy(button,fn,target='message'){const text=button.textContent;button.disabled=true;button.textContent='Procesando…';try{await fn();}catch(e){notice(e.message,true,target);}finally{button.disabled=false;button.textContent=text;}}
function options(values,selected){return values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function date(v){return v?new Date(v).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}):'—';}
Object.assign(labels,{idPostulacion:'Folio del candidato',idRequisicion:'Folio de la requisición',fecha:'Fecha de registro',nombreCandidato:'Nombre',telefono:'Teléfono',correo:'Correo',estatusProceso:'Estatus del proceso',notasReclutador:'Notas del equipo',puestoDeseado:'Puesto de interés',nivelEstudios:'Nivel de estudios',consentimientoEn:'Autorización del candidato',actualizadoEn:'Última actualización',actualizadoPor:'Actualizado por',estatus:'Estatus',nombre:'Nombre',rol:'Rol',activo:'Acceso activo'});
function details(obj){return '<dl>'+Object.entries(obj).filter(([k,v])=>v!==''&&v!=null&&!['cvFileId','linkCV','solicitudId','version'].includes(k)).map(([k,v])=>`<dt>${esc(labels[k]||k)}</dt><dd>${esc(typeof v==='boolean'?(v?'Sí':'No'):['fecha','consentimientoEn','actualizadoEn'].includes(k)?date(v):v)}</dd>`).join('')+'</dl>';}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;notice('',false,'modalMessage');$('modal').showModal();}
$('closeModal').onclick=()=>$('modal').close();
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)route(b.dataset.go);});
async function route(next){
  if($('modal').open)$('modal').close();
  view=next;notice('');filter='';submissionId=crypto.randomUUID();
  if(next==='inicio'){home();return;}
  if(next==='candidatos'){candidateForm();return;}
  if(next==='cliente'){clientForm();return;}
  if(!token){login();return;}
  if(profile?.cambiarPassword){passwordForm(true);return;}
  $('screen').innerHTML='<div class="card" role="status">Cargando tu espacio…</div>';
  try{if(!profile){profile=(await rpc('miSesion')).perfil;}if(profile.cambiarPassword){passwordForm(true);return;}panel=await rpc('panel');profile=panel.perfil;renderPanel();}catch(e){if(e.message==='Cambia tu contraseña para continuar.'){profile=profile||{correo:'',usuario:''};passwordForm(true);}else{notice(e.message,true);login();}}
}
async function home(){
  $('screen').innerHTML=`<section class="hero"><div><div class="eyebrow">Tu siguiente oportunidad</div><h1>El talento conecta.<br>El futuro comienza.</h1><p>Comparte tu experiencia, explora vacantes y da el siguiente paso con nuestro equipo de reclutamiento.</p><div class="actions"><button data-go="candidatos">Registrar mi perfil ↗</button></div></div><aside class="card"><div class="eyebrow">Así de sencillo</div><div class="step"><b>01 · Cuéntanos de ti</b><span>Tu experiencia y el puesto que buscas.</span></div><div class="step"><b>02 · Comparte tu CV</b><span>Adjúntalo si lo tienes a la mano.</span></div><div class="step"><b>03 · Conectamos contigo</b><span>El equipo revisa tu perfil y da seguimiento.</span></div></aside></section><section><div class="toolbar"><h2>Oportunidades abiertas</h2><span class="badge">Vacantes activas</span></div><div id="jobs" class="jobs"><p>Cargando oportunidades…</p></div></section>`;
  try{jobs=await rpc('vacantes');if(view!=='inicio')return;$('jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><span class="badge">${esc(j.ubicacion||'Ubicación por confirmar')}</span><h3 style="margin-top:15px">${esc(j.nombrePosicion)}</h3><p>${esc(j.objetivoPuesto||j.experienciaRequerida||'Consulta los detalles con nuestro equipo.')}</p><button class="secondary" data-job="${esc(j.idRequisicion)}">Ver y postularme</button></article>`).join(''):'<div class="card full"><h3>Tu talento tiene lugar aquí</h3><p>Aún no hay vacantes publicadas. Puedes registrar tu perfil para futuras oportunidades.</p><button data-go="candidatos">Enviar mi perfil</button></div>';
  document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>candidateForm(b.dataset.job));
  }catch(e){if(view==='inicio')$('jobs').textContent=e.message;}
}
function field(name,label,type='text',required=false){return `<div><label for="${name}">${esc(label)}${required?' *':''}</label><input id="${name}" name="${name}" type="${type}" ${required?'required':''} maxlength="${type==='email'?180:200}" ${type==='number'?'min="1" max="1000" value="1"':''}></div>`;}
function trap(){return '<div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>';}
async function candidateForm(jobId=''){
  view='candidatos';submissionId=crypto.randomUUID();
  $('screen').innerHTML=`<div class="narrow"><div class="eyebrow">Candidatos</div><h1>Hablemos de tu talento.</h1><p>Completa tu perfil. El CV es opcional; puedes registrarte aunque todavía no lo tengas.</p><form id="candidate" class="card">${trap()}<div class="grid">${field('nombreCandidato','Nombre completo','text',true)}${field('telefono','Teléfono celular','tel',true)}${field('correo','Correo electrónico','email',true)}${field('puestoDeseado','Puesto o área de interés','text',true)}<div><label for="nivelEstudios">Nivel de estudios *</label><select name="nivelEstudios" id="nivelEstudios" required><option value="">Selecciona</option>${options(['Secundaria','Preparatoria','Carrera técnica','Universidad trunca','Universidad terminada','Posgrado','Otro'])}</select></div><div><label for="idRequisicion">Vacante</label><select id="idRequisicion" name="idRequisicion"><option value="ESPONTANEO">Registro para futuras oportunidades</option></select></div><div id="jobDetail" class="full" hidden></div><div class="full"><label for="cv">Currículum (opcional)</label><input id="cv" type="file" accept=".pdf,.doc,.docx"><p class="muted">PDF o Word · Hasta 5 MB · Se guarda de forma privada.</p></div></div><div class="notice"><b>Uso de tu información</b><p class="muted">HiTalent / Worketers utilizará tus datos de contacto, experiencia y CV para revisar tu perfil y contactarte por oportunidades laborales. Tendrán acceso el equipo autorizado de reclutamiento y su administrador. Para solicitar corrección o eliminación, contacta al equipo de HiTalent / Worketers que te compartió este portal.</p><label><input type="checkbox" name="consentimiento" required> Autorizo el uso de mi información para estos fines. *</label></div><button type="submit">Enviar mi perfil</button></form></div>`;
  $('candidate').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{
    const form=e.target,d=Object.fromEntries(new FormData(form));d.consentimiento=true;d.solicitudId=submissionId;
    const f=$('cv').files[0];if(f){if(f.size>5*1024*1024)throw new Error('El CV debe pesar hasta 5 MB.');if(!/\.(pdf|doc|docx)$/i.test(f.name))throw new Error('Selecciona PDF o Word.');const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=()=>reject(new Error('No se pudo leer el archivo.'));r.readAsDataURL(f);});d.cv={nombre:f.name,base64};}
    const result=await rpc('postular',d);$('screen').innerHTML=`<div class="card narrow"><span class="badge">Perfil recibido</span><h1>Ya estás en nuestra bolsa.</h1><p>Tu registro se guardó correctamente. El equipo se pondrá en contacto contigo si hay una oportunidad para tu perfil.</p><p class="muted">Folio: ${esc(result.id)}</p><button data-go="inicio">Volver al inicio</button></div>`;notice('');
  });};
  try{jobs=await rpc('vacantes');if(view!=='candidatos'||!$('idRequisicion'))return;$('idRequisicion').innerHTML='<option value="ESPONTANEO">Registro para futuras oportunidades</option>'+jobs.map(j=>`<option value="${esc(j.idRequisicion)}">${esc(j.nombrePosicion)} · ${esc(j.ubicacion)}</option>`).join('');if(jobs.some(j=>j.idRequisicion===jobId))$('idRequisicion').value=jobId;
  const show=()=>{const j=jobs.find(j=>j.idRequisicion===$('idRequisicion').value);$('jobDetail').hidden=!j;if(j){$('jobDetail').innerHTML=details({nombrePosicion:j.nombrePosicion,ubicacion:j.ubicacion,objetivoPuesto:j.objetivoPuesto,experienciaRequerida:j.experienciaRequerida,requisitosIndispensables:j.requisitosIndispensables});if(!$('puestoDeseado').value)$('puestoDeseado').value=j.nombrePosicion;}};$('idRequisicion').onchange=show;show();}catch(e){notice(e.message,true);}
}
function clientForm(){
  const groups=[['Datos de contacto',['nombreSolicitante','empresaCliente','telefonoContacto','celularContacto','emailContacto']],['La vacante',['nombrePosicion','numeroVacantes','tipoVacante','ubicacion','horarioLaboral','reportaA']],['Perfil y experiencia',['escolaridad','objetivoPuesto','experienciaRequerida','requisitosIndispensables','requisitosDeseables','conocimientosCualidades','habilidadesTecnologicas','idiomas','competenciasEvaluar','actividadesDesempenar']],['Compensación y contratación',['sueldoBruto','sueldoNeto','prestacionesLey','prestacionesSuperiores','compensacionesVariables','esquemaPago','frecuenciaPago','tipoContrato','periodoPrueba']],['Detalles adicionales',['requisitosAutoTransporte','observacionesExtras']]];
  const long=['objetivoPuesto','requisitosIndispensables','requisitosDeseables','conocimientosCualidades','actividadesDesempenar','observacionesExtras'];
  $('screen').innerHTML=`<div class="narrow"><div class="eyebrow">Empresas</div><h1>Encuentra a tu próximo talento.</h1><p>Comparte los detalles del puesto. El equipo revisará tu solicitud antes de publicar la vacante.</p><form id="client">${trap()}${groups.map(([title,fields])=>`<section class="card"><h2>${title}</h2><div class="grid">${fields.map(k=>long.includes(k)?`<div class="full"><label for="${k}">${labels[k]}</label><textarea name="${k}" id="${k}" maxlength="5000"></textarea></div>`:field(k,labels[k],k==='emailContacto'?'email':k==='numeroVacantes'?'number':'text',['nombreSolicitante','empresaCliente','emailContacto','nombrePosicion'].includes(k))).join('')}</div></section>`).join('')}<button type="submit">Enviar requisición</button></form></div>`;
  $('client').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const d=Object.fromEntries(new FormData(e.target));d.solicitudId=submissionId;const r=await rpc('requisicion',d);$('screen').innerHTML=`<div class="card narrow"><span class="badge">Solicitud recibida</span><h1>Estamos en contacto.</h1><p>El equipo revisará la requisición antes de publicarla.</p><p class="muted">Folio: ${esc(r.id)}</p><button data-go="inicio">Volver al inicio</button></div>`;});};
}
async function acceptSession(result){token=result.token;profile=result.perfil;sessionStorage.setItem('hitalent_session',token);notice('');if(profile.cambiarPassword)passwordForm(true);else await route('admin');}
function login(){
  $('screen').innerHTML=`<div class="card login"><div class="eyebrow">Espacio del equipo</div><h1 style="font-size:30px">Bienvenido de nuevo.</h1><p>Ingresa con el usuario y la contraseña de tu cuenta.</p><form id="passwordLogin"><label for="loginUser">Usuario o correo</label><input id="loginUser" autocomplete="username" required maxlength="180"><label for="loginPassword">Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="64"><div class="actions"><button type="submit">Entrar al panel</button></div></form><details style="margin-top:22px"><summary>Configurar o recuperar acceso del propietario</summary><p class="muted">Solo el propietario puede verificar su correo para establecer una contraseña. Los colaboradores deben pedir el acceso al superadmin.</p><form id="request">${field('loginEmail','Correo del propietario','email',true)}<div class="actions"><button type="submit" class="secondary">Solicitar código</button></div></form><form id="verify" hidden><label for="code">Código de 6 dígitos</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><p class="muted">Revisa tu correo. El código caduca en 10 minutos.</p><button type="submit">Verificar y configurar contraseña</button></form></details></div>`;
  $('passwordLogin').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const r=await rpc('iniciarSesion',{usuario:$('loginUser').value,password:$('loginPassword').value});await acceptSession(r);});};
  $('request').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{const r=await rpc('solicitarCodigo',{correo:$('loginEmail').value});$('verify').hidden=false;notice(r.message);$('code').focus();});};
  $('verify').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await acceptSession(await rpc('verificarCodigo',{correo:$('loginEmail').value,codigo:$('code').value}));});};
}
function passwordForm(required=false){
  $('screen').innerHTML=`<div class="card login"><div class="eyebrow">Tu cuenta</div><h1 style="font-size:30px">${required?'Define tu contraseña personal.':'Cambiar contraseña'}</h1><p>Usuario: <b>${esc(profile.usuario||profile.correo)}</b></p><p class="muted">De 12 a 64 caracteres. No compartas tu contraseña.</p><form id="changePassword">${required?'':'<label for="currentPassword">Contraseña actual</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="64">'}<label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="64"><div class="actions"><button type="submit">Guardar contraseña</button>${required?'':'<button type="button" id="cancelPassword" class="secondary">Cancelar</button>'}</div></form></div>`;
  if($('cancelPassword'))$('cancelPassword').onclick=()=>route('admin');
  $('changePassword').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{if($('newPassword').value!==$('confirmPassword').value)throw new Error('Las contraseñas no coinciden.');await acceptSession(await rpc('cambiarPassword',{actual:$('currentPassword')?.value||'',password:$('newPassword').value}));notice('Contraseña actualizada.');});};
}
function renderPanel(){
  $('screen').innerHTML=`<div class="toolbar"><div><div class="eyebrow">${profile.rol==='superadmin'?'Superadmin':profile.rol==='admin'?'Administración':'Reclutamiento'}</div><h1 style="font-size:34px;margin-bottom:4px">Tu espacio de trabajo.</h1><p>${esc(profile.nombre)} · ${esc(profile.correo)}</p></div><div class="actions"><button id="refresh" class="secondary">Actualizar</button><button id="logout" class="ghost">Cerrar sesión</button></div></div><div class="stats"><div class="stat"><strong>${panel.candidatos.length}</strong><span>Candidatos</span></div><div class="stat"><strong>${panel.requisiciones.filter(r=>r.estatus==='Activa').length}</strong><span>Vacantes activas</span></div><div class="stat"><strong>${panel.candidatos.filter(r=>r.estatusProceso==='Pendiente').length}</strong><span>Por revisar</span></div></div><div class="tabs"><button data-tab="candidatos">Candidatos</button><button data-tab="requisiciones">Requisiciones</button>${profile.rol==='superadmin'?'<button data-tab="usuarios">Equipo y accesos</button><button data-tab="bitacora">Bitácora</button>':''}${['admin','superadmin'].includes(profile.rol)?'<button id="checklistLink" class="secondary">Compartir checklist</button>':''}<button data-tab="perfil">Mi perfil</button></div><section class="card"><div class="toolbar"><h2 id="tableTitle"></h2><input id="search" placeholder="Buscar en esta vista" aria-label="Buscar en esta vista"></div><div id="table" class="tablewrap"></div></section>`;
  if($('checklistLink'))$('checklistLink').onclick=e=>busy(e.target,async()=>{const r=await rpc('enlaceChecklist');openModal('Enlace para la empresa',`<p>Copia este enlace y envíalo a la empresa para completar el checklist. No necesita una cuenta del equipo.</p><label for="shareUrl">Enlace del checklist</label><input id="shareUrl" readonly value="${esc(r.url)}"><div class="actions"><button id="copyChecklist">Copiar enlace</button></div>`);$('copyChecklist').onclick=async()=>{try{await navigator.clipboard.writeText(r.url);notice('Enlace copiado.',false,'modalMessage');}catch(e){$('shareUrl').select();notice('Selecciona y copia el enlace.',false,'modalMessage');}};});
  $('refresh').onclick=e=>busy(e.target,async()=>{panel=await rpc('panel');profile=panel.perfil;renderPanel();});
  $('logout').onclick=e=>busy(e.target,async()=>{await rpc('salir');token='';profile=null;panel=null;users=[];logs=[];sessionStorage.removeItem('hitalent_session');login();});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  $('search').oninput=e=>{filter=e.target.value.toLowerCase();renderTable();};switchTab(tab);
}
async function switchTab(next){
  tab=next;filter='';$('search').value='';document.querySelectorAll('[data-tab]').forEach(b=>b.className=b.dataset.tab===tab?'':'secondary');
  $('table').textContent='Cargando…';
  try{if(tab==='usuarios')users=await rpc('usuarios');if(tab==='bitacora')logs=await rpc('bitacora');renderTable();}catch(e){$('table').textContent=e.message;}
}
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">Sin registros que mostrar.</td></tr>`}</tbody></table>`;}
function renderTable(){
  $('search').hidden=tab==='perfil';
  const found=r=>Object.values(r).join(' ').toLowerCase().includes(filter);
  if(tab==='candidatos'){
    $('tableTitle').textContent='Candidatos';const rows=panel.candidatos.filter(found).slice().reverse();
    $('table').innerHTML=table(['Nombre','Interés','Contacto','Estatus','Recibido',''],rows.map(c=>`<tr><td><b>${esc(c.nombreCandidato)}</b></td><td>${esc(c.puestoDeseado)}<br><span class="muted">${esc(panel.requisiciones.find(r=>r.idRequisicion===c.idRequisicion)?.nombrePosicion||'Registro general')}</span></td><td>${esc(c.correo)}<br>${esc(c.telefono)}</td><td><span class="badge">${esc(c.estatusProceso)}</span></td><td>${date(c.fecha)}</td><td><button data-candidate="${esc(c.idPostulacion)}">Revisar</button></td></tr>`));
    document.querySelectorAll('[data-candidate]').forEach(b=>b.onclick=()=>editCandidate(b.dataset.candidate));
  }else if(tab==='requisiciones'){
    $('tableTitle').textContent='Requisiciones';$('table').innerHTML=table(['Puesto','Empresa','Ubicación','Estatus',''],panel.requisiciones.filter(found).slice().reverse().map(r=>`<tr><td><b>${esc(r.nombrePosicion)}</b><br>${esc(r.numeroVacantes)} vacante(s)</td><td>${esc(r.empresaCliente)}</td><td>${esc(r.ubicacion)}</td><td><span class="badge">${esc(r.estatus)}</span></td><td><button data-req="${esc(r.idRequisicion)}">Ver detalle</button></td></tr>`));document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>editReq(b.dataset.req));
  }else if(tab==='usuarios'){
    $('tableTitle').textContent='Equipo y accesos';$('table').innerHTML='<div class="actions"><button id="addUser">Agregar integrante</button></div>'+table(['Nombre','Usuario / correo','Rol','Acceso',''],users.filter(found).map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario)}<br><span class="muted">${esc(u.correo)}</span></td><td>${esc(u.rol)}</td><td>${u.activo?'Activo':'Suspendido'}</td><td><button data-user="${esc(u.correo)}">Administrar</button></td></tr>`));$('addUser').onclick=()=>editUser();document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>editUser(users.find(u=>u.correo===b.dataset.user)));
  }else if(tab==='bitacora'){
    $('tableTitle').textContent='Bitácora · últimos 500 eventos';const rows=logs.filter(found);$('table').innerHTML=table(['Fecha','Quién','Acción','Registro',''],rows.map(l=>`<tr><td>${date(l.fecha)}</td><td>${esc(l.actor)}</td><td>${esc(l.accion)}</td><td>${esc(l.entidad)}<br>${esc(l.registroId)}</td><td><button data-log="${esc(l.id)}">Cambios</button></td></tr>`));document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{const l=logs.find(x=>x.id===b.dataset.log);openModal('Detalle del cambio',`<p>${esc(l.actor)} · ${date(l.fecha)}</p><h3>Antes</h3><pre>${esc(l.antes)}</pre><h3>Después</h3><pre>${esc(l.despues)}</pre>`);});
  }else{
    $('tableTitle').textContent='Mi perfil';$('table').innerHTML=`<form id="myProfile">${field('profileName','Nombre visible','text',true)}<p>Usuario: ${esc(profile.usuario)}<br>${esc(profile.correo)} · ${esc(profile.rol)}</p><button type="submit">Guardar perfil</button><button type="button" id="myPassword" class="secondary">Cambiar contraseña</button></form>`;$('profileName').value=profile.nombre;$('myPassword').onclick=()=>passwordForm(false);$('myProfile').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{profile=await rpc('perfil',{nombre:$('profileName').value});notice('Perfil actualizado.');});};
  }
}
async function saved(){panel=await rpc('panel');profile=panel.perfil;$('modal').close();renderPanel();notice('Cambios guardados.');}
function editCandidate(id){const c=panel.candidatos.find(x=>x.idPostulacion===id);openModal(c.nombreCandidato,`<form id="editCandidate"><label for="status">Estatus del proceso</label><select id="status">${options(candStates,c.estatusProceso)}</select><label for="notes">Notas del reclutador</label><textarea id="notes" maxlength="10000">${esc(c.notasReclutador)}</textarea><div class="actions"><button type="submit">Guardar seguimiento</button>${c.cvFileId?'<button type="button" id="download" class="secondary">Descargar CV</button>':'<span class="muted">Sin CV adjunto</span>'}</div></form>${details(c)}`);
  $('editCandidate').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('actualizarCandidato',{id,version:c.version,estatusProceso:$('status').value,notasReclutador:$('notes').value});await saved();},'modalMessage');};
  if($('download'))$('download').onclick=e=>busy(e.target,async()=>{const r=await rpc('descargarCV',{id});const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:r.mime})),a=document.createElement('a');a.href=url;a.download=r.nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);},'modalMessage');
}
function editReq(id){const r=panel.requisiciones.find(x=>x.idRequisicion===id);openModal(r.nombrePosicion,`<form id="editReq"><label for="reqStatus">Publicación de la vacante</label><select id="reqStatus">${options(reqStates,r.estatus)}</select><p class="muted">Solo las vacantes activas aparecen en la bolsa pública. Los datos de contacto de la empresa permanecen en el panel del equipo.</p><button type="submit">Guardar estatus</button></form>${details(r)}`);$('editReq').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('actualizarRequisicion',{id,version:r.version,estatus:$('reqStatus').value});await saved();},'modalMessage');};}
function editUser(u){
  openModal(u?'Administrar integrante':'Crear acceso de colaborador',`<form id="editUser">${field('userEmail','Correo','email',true)}${field('userName','Nombre','text',true)}${field('userLogin','Usuario','text',true)}<label for="userPassword">${u?'Nueva contraseña inicial (opcional)':'Contraseña inicial *'}</label><input id="userPassword" type="password" autocomplete="new-password" minlength="12" maxlength="64" ${u?'':'required'}><p class="muted">De 12 a 64 caracteres. El integrante deberá cambiarla al ingresar. Si se deja vacía al editar, conserva la contraseña actual.</p><label for="role">Rol</label><select id="role">${options(['reclutador','admin','superadmin'],u?.rol||'reclutador')}</select><label><input type="checkbox" id="active" ${!u||u.activo?'checked':''}> Acceso activo</label><p class="muted">El administrador puede compartir el checklist. Solo el superadmin administra usuarios y consulta la bitácora. Los cambios de acceso cierran las sesiones del integrante.</p><button type="submit">Guardar acceso</button></form>`);
  if(u){$('userEmail').value=u.correo;$('userEmail').readOnly=true;$('userName').value=u.nombre;$('userLogin').value=u.usuario||u.correo;}
  $('editUser').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('guardarUsuario',{correo:$('userEmail').value,nombre:$('userName').value,usuario:$('userLogin').value,password:$('userPassword').value,rol:$('role').value,activo:$('active').checked,version:u?.version});if(u?.correo===profile.correo){token='';sessionStorage.removeItem('hitalent_session');$('modal').close();login();notice('Acceso actualizado. Inicia sesión de nuevo.');}else{users=await rpc('usuarios');$('modal').close();renderTable();notice('Acceso guardado. Comparte el usuario y la contraseña inicial directamente con el integrante.');}},'modalMessage');};
}
route(initialView);
</script></body></html>
