<style>
/* Way Finder: estilos comunes de la aplicación. */
:root{
--ink:#152f35;
--muted:#5c7478;
--teal:#007f83;
--line:#d8e5e4;
--paper:#fff;
--bg:#f3f7f6}
*{
box-sizing:border-box}
body{
margin:0;
background:var(--bg);
color:var(--ink);
font:15px/1.55 'Segoe UI',sans-serif}
button,input,select,textarea{
font:inherit}
button,a,input,select,textarea{
outline-offset:4px}
button,.button{
border:0;
border-radius:9px;
padding:11px 18px;
background:var(--teal);
color:white;
font-weight:600;
cursor:pointer;
text-decoration:none;
display:inline-block}
button:hover,.button:hover{
filter:brightness(.94)}
button:disabled{
opacity:.5;
cursor:wait}
.secondary{
background:#e5efed;
color:var(--ink)}
.ghost{
background:transparent;
color:var(--teal)}
header{
border-bottom:1px solid var(--line);
background:white;
padding:16px 5%;
display:flex;
align-items:center;
gap:24px;
justify-content:space-between}
.brand{
font-size:25px;
font-weight:800;
letter-spacing:-1px;
color:var(--teal)}
.brand small{
display:block;
font-size:10px;
letter-spacing:2px;
color:var(--muted)}
nav{
display:flex;
gap:5px;
flex-wrap:wrap}
nav button{
font-size:13px}
main{
max-width:1200px;
margin:35px auto;
padding:0 24px}
h1{
font-size:clamp(28px,4vw,46px);
line-height:1.15;
letter-spacing:-1px;
margin:12px 0 18px}
h2{
font-size:24px;
margin:0 0 16px}
h3{
margin:0 0 8px}
p{
color:var(--muted)}
.eyebrow{
font-size:12px;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
color:var(--teal)}
.hero{
display:grid;
grid-template-columns:1.3fr 1fr;
gap:36px;
align-items:center;
padding:42px 0}
.hero p{
max-width:560px;
font-size:17px}
.card{
background:var(--paper);
border:1px solid var(--line);
border-radius:16px;
padding:26px;
margin-bottom:20px}
.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:20px}
.jobs{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:16px}
.job{
padding:22px;
border:1px solid var(--line);
border-radius:12px;
background:white}
.job p{
white-space:pre-wrap}
.badge{
display:inline-block;
border-radius:20px;
padding:3px 10px;
background:#e0f3ee;
color:#146052;
font-size:12px;
font-weight:600}
.label,label{
display:block;
font-size:13px;
font-weight:600;
margin:12px 0 5px}
input,select,textarea{
width:100%;
padding:11px 12px;
border:1px solid #b9cfcc;
border-radius:8px;
background:white;
color:var(--ink)}
textarea{
min-height:110px;
resize:vertical}
input[type=checkbox]{
width:auto}
.full{
grid-column:1/-1}
.muted{
color:var(--muted);
font-size:13px}
.actions{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap;
margin-top:18px}
.notice{
padding:14px 18px;
border:1px solid var(--line);
border-radius:10px;
background:#e5f4ef;
white-space:pre-wrap;
margin:16px 0}
.error{
background:#fff0ed;
color:#8c2d20;
border-color:#e6b7ae}
[hidden]{
display:none!important}
.narrow{
max-width:740px;
margin:auto}
.login{
max-width:440px;
margin:55px auto}
.toolbar{
display:flex;
gap:12px;
justify-content:space-between;
align-items:center;
flex-wrap:wrap}
.toolbar input{
max-width:350px}
.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:24px 0}
.tablewrap{
overflow:auto}
table{
border-collapse:collapse;
width:100%;
font-size:13px}
th,td{
padding:13px 12px;
text-align:left;
border-bottom:1px solid var(--line);
vertical-align:top}
th{
color:var(--muted);
font-size:11px;
text-transform:uppercase;
letter-spacing:.6px}
td button{
padding:7px 12px;
font-size:12px}
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
margin:22px 0}
.stat{
border:1px solid var(--line);
border-radius:12px;
background:white;
padding:20px}
.stat strong{
font-size:30px;
display:block}
.stat span{
color:var(--muted);
font-size:13px}
dialog{
border:1px solid var(--line);
border-radius:16px;
padding:26px;
width:min(850px,94vw);
max-height:90vh;
color:var(--ink)}
dialog::backdrop{
background:#152f3577}
dl{
display:grid;
grid-template-columns:1fr 2fr;
gap:0;
margin:16px 0}
dt,dd{
padding:8px 0;
border-bottom:1px solid var(--line);
margin:0;
white-space:pre-wrap;
overflow-wrap:anywhere}
dt{
font-size:12px;
color:var(--muted)}
dd{
padding-left:14px}
pre{
white-space:pre-wrap;
overflow-wrap:anywhere;
background:var(--bg);
padding:12px;
font-size:12px}
footer{
max-width:1200px;
margin:50px auto 20px;
padding:20px 24px;
border-top:1px solid var(--line);
font-size:12px;
color:var(--muted)}
.trap{
position:absolute;
left:-10000px}
.step{
border-left:3px solid var(--teal);
padding:0 0 0 18px;
margin:22px 0}
.step b{
display:block}
.step span{
color:var(--muted);
font-size:13px}
@media(max-width:760px){
header{
align-items:flex-start;
flex-direction:column;
gap:12px}
.hero,.grid,.jobs{
grid-template-columns:1fr}
.hero{
padding:15px 0;
gap:15px}
main{
padding:0 16px;
margin-top:24px}
.card{
padding:20px}
.stats{
gap:8px}
.stat{
padding:12px}
.stat strong{
font-size:25px}
h1{
font-size:34px}
dl{
grid-template-columns:1fr}
dd{
padding-left:0}
}

/* Identidad Way Finder. La aplicación cambia de nombre, la marca se conserva. */
:root{
 --wk-primary:#0096a3;--wk-action:#007a84;--wk-ink:#173239;--wk-background:#f3f7f7;
 --wk-muted:#60747b;--wk-border:#dbe6e7;--wk-surface:#fff;--wk-soft:#e7f3f3;
 --ink:var(--wk-ink);--muted:var(--wk-muted);--teal:var(--wk-action);--line:var(--wk-border);--paper:var(--wk-surface);--bg:var(--wk-background);
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:650;line-height:1.4;transition:background .16s,box-shadow .16s}
button:hover,.button:hover{box-shadow:0 3px 12px #17323915;filter:brightness(.95)}
button:disabled{box-shadow:none}
.secondary{background:var(--wk-soft);color:var(--wk-action);border-color:#d4e9e9}
.ghost{color:var(--wk-muted);background:transparent}
.ghost:hover{color:var(--wk-action);background:var(--wk-soft);box-shadow:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--wk-primary);outline-offset:4px}
header{padding:21px max(28px,calc((100vw - 1104px)/2));gap:24px}
.brand-lockup{display:flex;align-items:center;gap:20px;flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:3px;color:var(--wk-action);font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-1.35px}
.brand-mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wk-primary)}
.brand-module{display:flex;flex-direction:column;border-left:1px solid var(--wk-border);padding-left:20px;line-height:1.35}
.brand-module strong{font-size:15px;letter-spacing:-.2px;font-weight:700}
.brand-module span{margin-top:2px;font-size:11px;color:var(--wk-muted)}
nav{gap:7px;align-items:center}nav button{font-size:13px;padding-inline:15px}
main{max-width:1160px;margin:34px auto;padding:0 28px}
h1{font-size:clamp(34px,4vw,52px);line-height:1.12;letter-spacing:-1.9px;font-weight:730;margin:14px 0 22px}
h2{font-size:23px;line-height:1.3;letter-spacing:-.65px;font-weight:700}
h3{font-size:18px;line-height:1.4;letter-spacing:-.35px}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:750;letter-spacing:1.6px}
.eyebrow::before{content:'';width:18px;height:2px;background:var(--wk-primary);flex-shrink:0}
.hero{grid-template-columns:1.2fr 1fr;gap:64px;padding:42px 0 50px}
.hero>div>p{max-width:480px;font-size:17px;line-height:1.75}
.card{border-radius:16px;padding:28px;margin-bottom:22px}
.hero .card{position:relative;padding:30px 32px 18px;margin:0;box-shadow:0 14px 40px #17323908;overflow:hidden}
.hero .card::before{position:absolute;content:'';width:64px;height:3px;top:0;left:32px;background:var(--wk-primary)}
.grid{gap:18px 22px}.jobs{gap:18px}.job{border-radius:16px;padding:24px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--wk-soft);color:var(--wk-action);padding:5px 11px;border-radius:6px;font-size:11px;font-weight:650}
label,.label{margin:12px 0 7px;font-size:13px;font-weight:650}
input,select,textarea{border-color:#c7d8da;border-radius:9px;padding:11px 13px}
input::placeholder,textarea::placeholder{color:#7b8f95}
input:focus,select:focus,textarea:focus{border-color:var(--wk-action)}
input[readonly]{background:var(--wk-background)}
input[type=checkbox]{accent-color:var(--wk-action)}
input[type=file]{background:var(--wk-background);border-style:dashed;font-size:13px}
.actions{margin-top:23px}
.notice{background:var(--wk-soft);color:var(--wk-ink);border-color:#cbe4e3;padding:15px 18px;margin:18px 0}
.error{background:#fff1ee;color:#993d30;border-color:#ebc5be}
.narrow{max-width:780px}
.login{max-width:460px;margin:60px auto;padding:32px;box-shadow:0 14px 40px #17323906}
.login h1{letter-spacing:-.9px}
summary{cursor:pointer;color:var(--wk-action);font-size:13px;font-weight:600}
.toolbar{gap:16px}.toolbar h2{margin-bottom:8px}.toolbar input{max-width:340px}
.tabs{align-items:center;gap:7px;margin:26px 0 20px}.tabs button{font-size:13px}
th,td{padding:15px 13px}th{background:var(--wk-background);font-size:10px;font-weight:700;letter-spacing:.9px}
td button{min-height:34px}
.stats{gap:18px;margin:28px 0}.stat{border-radius:16px;padding:23px}
.stat strong{color:var(--wk-action);font-size:34px;line-height:1.3;letter-spacing:-1px;font-weight:700}
.stat span{display:block;margin-top:6px;font-size:12px}
dialog{padding:28px;box-shadow:0 25px 90px #17323920}
dialog::backdrop{background:#17323980}
footer{max-width:1104px;margin:52px auto 24px;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:11px}
footer strong{color:var(--wk-action);font-weight:700}
.step{border-left:0;border-bottom:1px solid var(--wk-border);padding:0 0 19px;margin:20px 0}
.step:last-child{border-bottom:0;margin-bottom:0}.step b{font-size:14px;font-weight:650}.step span{display:block;margin-top:5px;font-size:12px}
@media(max-width:760px){
 header{padding:22px;gap:20px}nav{width:100%;gap:4px}nav button{flex:1;padding-inline:10px;font-size:12px}
 main{margin:26px auto;padding:0 20px}.hero{grid-template-columns:1fr;gap:30px;padding:12px 0 34px}
 h1{font-size:37px;letter-spacing:-1.3px}.hero>div>p{font-size:16px}.card{padding:22px}.hero .card{padding:26px 24px 12px}
 .stats{gap:9px}.stat{padding:15px 12px;border-radius:12px}.stat strong{font-size:27px}.stat span{font-size:11px}
 .login{margin:32px auto;padding:26px}footer{margin:36px 20px 20px;align-items:flex-start;flex-direction:column;gap:5px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}


.psico-stats{grid-template-columns:repeat(4,1fr)}.psico-tools p{margin:0}.psico-tools select{width:auto;min-width:150px}.psico-tools .actions{margin-top:0}.psico-note{margin:22px 0 0}.psico-meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:22px}.psico-meta p{overflow-wrap:anywhere;font-size:13px}.psico-meta span{display:block;color:var(--wk-muted);font-size:11px;margin-bottom:5px}.psico-meta b{font-weight:600}.psico-series{display:grid;grid-template-columns:140px 1fr 65px 120px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--wk-border);font-size:12px}.psico-series small{font-size:10px;color:var(--wk-muted)}.psico-bar{height:8px;background:var(--wk-soft);border-radius:6px;overflow:hidden}.psico-bar>div{height:100%;background:var(--wk-primary);border-radius:6px}.psico-answer{padding:12px;background:var(--wk-background);border-radius:9px;font-size:12px;margin-top:12px;overflow-wrap:anywhere}.psico-answer p{margin:5px 0 0}.psico-module details{margin:24px 0}.tabs{flex-wrap:wrap}#modal{width:min(960px,94vw)}
@media(max-width:760px){.psico-stats{grid-template-columns:1fr 1fr}.psico-tools{align-items:stretch}.psico-tools .actions{width:100%}.psico-tools select{flex:1}.psico-series{grid-template-columns:1fr 65px;gap:6px 12px}.psico-series .psico-bar{grid-column:1;grid-row:2}.psico-series small{grid-column:2;grid-row:2}.psico-series>span{text-align:right}}

:root{--wk-primary: #0096A3;--wk-action: #007A84;--wk-ink: #173239;--wk-background: #F3F7F7;}

.brand-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0}.brand:has(.brand-logo){align-items:center;gap:10px;letter-spacing:-1px}
.management-filters{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-top:18px}.management-filters>div{flex:1 1 145px;min-width:130px}.management-filters label{font-size:12px;margin:0 0 5px}.management-filters input,.management-filters select{margin:0;min-height:44px}.management-help{font-size:12px;margin:14px 0}.pagination{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.pagination p{font-size:12px;margin:0}.pagination .actions{margin:0;align-items:center}.pagination select{width:80px;margin:0}.pagination label{margin:0;font-size:12px}
@media(max-width:760px){.brand-logo{width:36px;height:36px}.brand:has(.brand-logo){font-size:24px}.management-filters>div{flex-basis:44%}.pagination .actions{width:100%;flex-wrap:wrap}.pagination button{flex:1}}

function managementPagination(r){
 const start=r.total?(r.pagina-1)*r.limite+1:0,end=Math.min(r.pagina*r.limite,r.total);
 $('pagination').innerHTML=`<div class="pagination"><p role="status" aria-live="polite">${start}–${end} de ${r.total} registros · Página ${r.pagina} de ${r.paginas}</p><div class="actions"><label for="pageSize">Por página</label><select id="pageSize">${[10,25,50,100].map(n=>`<option ${n===r.limite?'selected':''}>${n}</option>`).join('')}</select><button id="previousPage" class="secondary" ${r.pagina<=1?'disabled':''}>Anterior</button><button id="nextPage" class="secondary" ${r.pagina>=r.paginas?'disabled':''}>Siguiente</button></div></div>`;
 $('pageSize').onchange=e=>{Object.assign(viewState(),{limite:Number(e.target.value),pagina:1});renderTable();};
 $('previousPage').onclick=()=>{viewState().pagina=Math.max(1,r.pagina-1);renderTable();};$('nextPage').onclick=()=>{viewState().pagina=r.pagina+1;renderTable();};
}
async function renderTable(){
 if(tab==='perfil'){$('table').innerHTML=`<form id="myProfile">${field('profileName','Nombre visible','text',true)}<p>Usuario: ${esc(profile.usuario)}<br>${esc(profile.correo)} · ${esc(profile.rol)}</p><button type="submit">Guardar perfil</button><button type="button" id="myPassword" class="secondary">Cambiar contraseña</button></form>`;$('profileName').value=profile.nombre;$('myPassword').onclick=()=>passwordForm(false);$('myProfile').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{profile=await rpc('perfil',{nombre:$('profileName').value});notice('Perfil actualizado.');});};return;}
 const requestedTab=tab,id=++managementRequest;const state={...viewState()};
 $('table').textContent='Cargando registros…';$('pagination').textContent='';$('table').setAttribute('aria-busy','true');
 try{
  const r=await rpc('gestion',{entidad:requestedTab,...state});if(id!==managementRequest||tab!==requestedTab||view!=='admin'&&view!=='superadmin')return;
  viewState().pagina=r.pagina;const rows=r.registros;
  if(tab==='candidatos'){
   panel.candidatos=rows;$('table').innerHTML=table(['Nombre','Interés','Contacto','Estatus','Actividad','Recibido',''],rows.map(c=>`<tr><td><b>${esc(c.nombreCandidato)}</b></td><td>${esc(c.puestoDeseado)}<br><span class="muted">${esc(c.nombreRequisicion)}</span></td><td>${esc(c.correo)}<br>${esc(c.telefono)}</td><td><span class="badge">${esc(c.estatusProceso)}</span></td><td>${c.activo?'Activo':'Inactivo'}</td><td>${date(c.fecha)}</td><td><button data-candidate="${esc(c.idPostulacion)}">Revisar</button></td></tr>`));document.querySelectorAll('[data-candidate]').forEach(b=>b.onclick=()=>editCandidate(b.dataset.candidate));
  }else if(tab==='requisiciones'){
   panel.requisiciones=rows;$('table').innerHTML=table(['Puesto','Empresa','Ubicación','Publicación','Actividad',''],rows.map(r=>`<tr><td><b>${esc(r.nombrePosicion)}</b><br>${esc(r.numeroVacantes)} vacante(s)</td><td>${esc(r.empresaCliente)}</td><td>${esc(r.ubicacion)}</td><td><span class="badge">${esc(r.estatus)}</span></td><td>${r.activo?'Activa':'Inactiva'}</td><td><button data-req="${esc(r.idRequisicion)}">Ver detalle</button></td></tr>`));document.querySelectorAll('[data-req]').forEach(b=>b.onclick=()=>editReq(b.dataset.req));
  }else if(tab==='usuarios'){
   users=rows;$('table').innerHTML='<div class="actions"><button id="addUser">Agregar integrante</button></div>'+table(['Nombre','Usuario / correo','Rol','Acceso',''],rows.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.usuario)}<br>${esc(u.correo)}</td><td>${esc(u.rol)}</td><td>${u.activo?'Activo':'Suspendido'}</td><td><button data-user="${esc(u.correo)}">Administrar</button></td></tr>`));$('addUser').onclick=()=>editUser();document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>editUser(users.find(u=>u.correo===b.dataset.user)));
  }else if(tab==='bitacora'){
   logs=rows;$('table').innerHTML=table(['Fecha','Quién','Acción','Registro',''],rows.map(l=>`<tr><td>${date(l.fecha)}</td><td>${esc(l.actor)}</td><td>${esc(l.accion)}</td><td>${esc(l.entidad)}<br>${esc(l.registroId)}</td><td><button data-log="${esc(l.id)}">Cambios</button></td></tr>`));document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{const l=logs.find(x=>x.id===b.dataset.log);openModal('Detalle del cambio',`<p>${esc(l.actor)} · ${date(l.fecha)}</p><h3>Antes</h3><pre>${esc(l.antes)}</pre><h3>Después</h3><pre>${esc(l.despues)}</pre>`);});
  }else{psicoRecords=rows;psicoSummary=r.resumen;psicoRender();}
  managementPagination(r);
 }catch(e){if(id===managementRequest&&tab===requestedTab){$('table').textContent=e.message;$('pagination').innerHTML='<button id="retryPage" class="secondary">Reintentar</button>';$('retryPage').onclick=()=>renderTable();}}
 finally{if(id===managementRequest)$('table').setAttribute('aria-busy','false');}
}

async function saved(){panel=await rpc('panelResumen');profile=panel.perfil;$('modal').close();renderPanel();notice('Cambios guardados.');}
function editCandidate(id){const c=panel.candidatos.find(x=>x.idPostulacion===id);openModal(c.nombreCandidato,`<form id="editCandidate"><label><input id="recordActive" type="checkbox" ${c.activo!==false?'checked':''}> Candidato activo</label><p class="muted">Al inactivarlo se oculta de la vista habitual. Su CV, evaluaciones y cambios se conservan. Puedes reactivarlo aquí.</p><label for="status">Estatus del proceso</label><select id="status">${options(candStates,c.estatusProceso)}</select><label for="notes">Notas del reclutador</label><textarea id="notes" maxlength="10000">${esc(c.notasReclutador)}</textarea><div class="actions"><button type="submit">Guardar seguimiento</button>${c.cvFileId?'<button type="button" id="download" class="secondary">Descargar CV</button>':'<span class="muted">Sin CV adjunto</span>'}</div></form><div class="actions"><button type="button" id="inviteCandidatePsico" class="secondary">Enviar psicométrico por correo</button></div>${details(c)}`);
  $('inviteCandidatePsico').onclick=()=>psicoInviteModal(c);
  $('editCandidate').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('actualizarCandidato',{id,version:c.version,estatusProceso:$('status').value,notasReclutador:$('notes').value,activo:$('recordActive').checked});await saved();},'modalMessage');};
  if($('download'))$('download').onclick=e=>busy(e.target,async()=>{const r=await rpc('descargarCV',{id});const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:r.mime})),a=document.createElement('a');a.href=url;a.download=r.nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);},'modalMessage');
}
function editReq(id){const r=panel.requisiciones.find(x=>x.idRequisicion===id);openModal(r.nombrePosicion,`<form id="editReq"><label><input id="reqActive" type="checkbox" ${r.activo!==false?'checked':''}> Requisición activa</label><p class="muted">Una requisición inactiva se retira de la bolsa pública y de la vista habitual. Conserva su historial y candidatos.</p><label for="reqStatus">Publicación de la vacante</label><select id="reqStatus">${options(reqStates,r.estatus)}</select><p class="muted">Solo las vacantes activas aparecen en la bolsa pública. Los datos de contacto de la empresa permanecen en el panel del equipo.</p><button type="submit">Guardar estatus</button></form>${details(r)}`);$('editReq').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('actualizarRequisicion',{id,version:r.version,estatus:$('reqStatus').value,activo:$('reqActive').checked});await saved();},'modalMessage');};}
function editUser(u){
  openModal(u?'Administrar integrante':'Crear acceso de colaborador',`<form id="editUser">${field('userEmail','Correo','email',true)}${field('userName','Nombre','text',true)}${field('userLogin','Usuario','text',true)}<label for="userPassword">${u?'Nueva contraseña inicial (opcional)':'Contraseña inicial *'}</label><input id="userPassword" type="password" autocomplete="new-password" minlength="12" maxlength="64" ${u?'':'required'}><p class="muted">De 12 a 64 caracteres. El integrante deberá cambiarla al ingresar. Si se deja vacía al editar, conserva la contraseña actual.</p><label for="role">Rol</label><select id="role">${options(['reclutador','admin','superadmin'],u?.rol||'reclutador')}</select><label><input type="checkbox" id="active" ${!u||u.activo?'checked':''}> Acceso activo</label><p class="muted">El administrador puede compartir el checklist. Solo el superadmin administra usuarios y consulta la bitácora. Los cambios de acceso cierran las sesiones del integrante.</p><button type="submit">Guardar acceso</button></form>`);
  if(u){$('userEmail').value=u.correo;$('userEmail').readOnly=true;$('userName').value=u.nombre;$('userLogin').value=u.usuario||u.correo;}
  $('editUser').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{await rpc('guardarUsuario',{correo:$('userEmail').value,nombre:$('userName').value,usuario:$('userLogin').value,password:$('userPassword').value,rol:$('role').value,activo:$('active').checked,version:u?.version});if(u?.correo===profile.correo){token='';sessionStorage.removeItem('hitalent_session');$('modal').close();login();notice('Acceso actualizado. Inicia sesión de nuevo.');}else{$('modal').close();renderTable();notice('Acceso guardado. Comparte el usuario y la contraseña inicial directamente con el integrante.');}},'modalMessage');};
}
// Módulo integrado: utiliza rpc, la sesión y los diálogos del portal de Recruitment.
let psicoRecords=[],psicoSummary={total:0,completadas:0,vencidas:0,pendientes:0};
const psicoAreas=['Información','Juicio','Vocabulario','Síntesis','Concentración','Análisis','Abstracción','Planeación','Organización','Atención'];
const psicoMax=[16,22,30,18,24,20,20,17,18,22];
function psicoRender(){
 $('tableTitle').textContent='Psicométricos';$('search').hidden=false;
 const done=psicoSummary.completadas,expired=psicoSummary.vencidas;
 const found=psicoRecords;
 $('table').innerHTML=`<div class="psico-module"><div class="stats psico-stats"><div class="stat"><strong>${psicoSummary.total}</strong><span>Invitaciones</span></div><div class="stat"><strong>${done}</strong><span>Completadas</span></div><div class="stat"><strong>${psicoSummary.pendientes}</strong><span>Pendientes</span></div><div class="stat"><strong>${expired}</strong><span>Vencidas</span></div></div><div class="toolbar psico-tools"><p class="muted">Invitaciones por correo · Vigencia de 24 horas</p><div class="actions"><button id="psicoNew">Enviar invitación</button></div></div>${table(['Persona','Correo','Evaluación','Vigencia hasta',''],found.map(c=>`<tr><td><b>${esc(c.nombre)}</b><br><span class="muted">${esc(c.tipo)}</span></td><td>${esc(c.correo)}</td><td><span class="badge">${esc(c.status==='Completado'?'Completada':c.vigencia)}</span>${c.estadoCorreo==='Envío fallido'?'<br><span class="muted">Correo no enviado</span>':''}</td><td>${date(c.expiraEn)}</td><td><button class="secondary" data-psico="${esc(c.id)}">${c.status==='Completado'?'Ver resultados':'Ver detalle'}</button></td></tr>`))}<p class="muted psico-note">Las evaluaciones se consultan con los permisos de tu cuenta del equipo. Las invitaciones vencidas requieren un nuevo envío.</p></div>`;
 $('psicoNew').onclick=()=>psicoInviteModal();
 document.querySelectorAll('[data-psico]').forEach(b=>b.onclick=()=>psicoResult(b.dataset.psico));
}
function psicoInviteModal(c){
 const linked=c?.idPostulacion||'',name=c?.nombreCandidato||c?.nombre||'',email=c?.correo||'';let requestId=crypto.randomUUID();
 openModal('Invitar a evaluación psicométrica',`<form id="psicoInvite"><p>Se enviará una liga personal al correo de la persona. Tendrá <b>24 horas para completar y entregar</b> la evaluación desde este envío.</p><label for="psicoName">Nombre completo *</label><input id="psicoName" required maxlength="150" value="${esc(name)}"><label for="psicoEmail">Correo del candidato *</label><input id="psicoEmail" type="email" required maxlength="180" value="${esc(email)}" ${linked?'readonly':''}><div class="grid"><div><label for="psicoType">Perfil</label><select id="psicoType">${options(['Candidato','Empleado'],c?.tipo||'Candidato')}</select></div><div id="psicoAgeField"><label for="psicoAge">Edad *</label><input id="psicoAge" type="number" min="18" max="99" required value="${/^\d{2}$/.test(String(c?.edad||''))?esc(c.edad):''}"></div></div><p class="muted">El mensaje incluirá el nombre Way Finder, las instrucciones y la fecha exacta de vencimiento en hora de Ciudad de México.</p><div class="actions"><button id="psicoSend" type="submit">Enviar invitación por correo</button><button id="psicoCancel" type="button" class="secondary">Cancelar</button></div></form>`);
 const profileChange=()=>{const internal=$('psicoType').value==='Empleado';$('psicoAgeField').hidden=internal;$('psicoAge').required=!internal;};$('psicoType').onchange=profileChange;profileChange();$('psicoCancel').onclick=()=>$('modal').close();
 $('psicoInvite').onsubmit=e=>{e.preventDefault();busy(e.submitter,async()=>{
 const r=await rpc('psicoInvitar',{nombre:$('psicoName').value,correo:$('psicoEmail').value,edad:$('psicoAge').value,tipo:$('psicoType').value,idPostulacion:linked,solicitudId:requestId});
 $('modalTitle').textContent='Invitación enviada';$('modalBody').innerHTML=`<div class="notice"><b>Correo enviado a ${esc(r.correo)}</b><p>La evaluación puede completarse hasta el <b>${date(r.expiraEn)}</b>.</p></div><p>La liga tiene vigencia de 24 horas y permite completar una sola evaluación.</p><div class="actions"><button id="psicoShowPanel">Ver psicométricos</button><button id="psicoDone" class="secondary">Cerrar</button></div>`;
 $('psicoShowPanel').onclick=async()=>{$('modal').close();await switchTab('psicometricos');};$('psicoDone').onclick=()=>$('modal').close();notice('',false,'modalMessage');if(tab==='psicometricos'){await renderTable();}
 },'modalMessage');};
}
function psicoResult(id){const c=psicoRecords.find(c=>c.id===id);if(!c)return;
 const complete=c.status==='Completado';
 const metadata=`<div class="psico-meta"><p><span>Folio</span><b>${esc(c.id)}</b></p><p><span>Correo</span>${esc(c.correo)}</p><p><span>Inicio</span>${esc(c.fecha||'Sin iniciar')}</p><p><span>Vigencia hasta</span>${date(c.expiraEn)}</p></div>`;
 const chart=psicoAreas.map((n,i)=>{const pair=String(c.rangos?.['S'+(i+1)]||'').split('|'),p=pair[0]||'0',pct=Math.max(0,Math.min(100,(Number(p)||0)/psicoMax[i]*100));return `<div class="psico-series"><b>${i+1}. ${n}</b><div class="psico-bar" role="img" aria-label="${esc(n)}: ${esc(p)} de ${psicoMax[i]} puntos"><div style="width:${pct}%"></div></div><span>${esc(p)} / ${psicoMax[i]}</span><small>${esc(pair[1]||'Sin datos')}</small></div>`;}).join('');
 openModal(c.nombre,`<div class="psico-module"><span class="badge">${esc(complete?'Completada':c.vigencia)}</span>${metadata}${complete?`<div class="stats"><div class="stat"><strong>${esc(c.score)}</strong><span>Puntuación total</span></div><div class="stat"><strong>${esc(c.ci||'—')}</strong><span>CI de referencia</span></div><div class="stat"><strong>${esc(c.eficiencia)}</strong><span>Eficiencia</span></div></div><h3>Perfil por áreas</h3><p class="muted">Puntos sobre el máximo de cada serie. Los rangos provienen del baremo existente; no son percentiles.</p>${chart}<details><summary>Consultar respuestas registradas</summary>${psicoAreas.map((n,i)=>`<div class="psico-answer"><b>Serie ${i+1} · ${n}</b><p>${esc(c.respuestas?.['S'+(i+1)]||'Sin respuestas registradas')}</p></div>`).join('')}</details><p class="notice">La interpretación corresponde al profesional responsable. Estos resultados no constituyen por sí solos un diagnóstico ni una decisión de contratación.</p><div class="actions"><button id="psicoDownload">Descargar reporte PDF</button></div>`:`<p class="notice">${c.vigencia==='Vencida'?'La liga venció. Envía una nueva invitación para dar otras 24 horas.':c.vigencia==='Sin vigencia'?'Este registro no tiene una vigencia válida. Envía una nueva invitación.':'La evaluación todavía no se ha completado.'}</p><button id="psicoReinvite">Enviar nueva invitación por correo</button>`}</div>`);
 if($('psicoReinvite'))$('psicoReinvite').onclick=()=>psicoInviteModal(c);
 if($('psicoDownload'))$('psicoDownload').onclick=e=>busy(e.target,async()=>{const r=await rpc('psicoPDF',{id:c.id}),bytes=Uint8Array.from(atob(r.base64),v=>v.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);},'modalMessage');
}

route(initialView);
</script></body></html>
